{% set name = "scix-client" %}
{% set version = "0.3.1" %}

# conda-forge recipe for scix-client.
#
# This file is a staging template for submission to
# github.com/conda-forge/staged-recipes. The sha256 below is for the PyPI
# source distribution and must be updated on each release.

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: REPLACE_WITH_PYPI_SDIST_SHA256

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - maturin >=1.5,<2.0
  run:
    - python

test:
  imports:
    - scix_client
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/yipihey/scix-client
  summary: Client for the SciX / NASA ADS astronomy database — library, CLI, and MCP server
  license: MIT
  license_file: LICENSE-MIT

extra:
  recipe-maintainers:
    - yipihey
